<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Tokyo Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09091b;font-family:Arial,sans-serif;touch-action:none;color:white}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;z-index:3;top:12px;left:12px;right:12px;display:none;justify-content:space-between;gap:7px;pointer-events:none}
.pill{padding:10px 12px;border:1px solid #ffffff40;background:#111831b8;border-radius:12px;font-weight:bold;font-size:clamp(12px,3vw,19px);text-shadow:0 0 8px #ff00ff}
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#09091bc9;backdrop-filter:blur(8px)}
.hidden{display:none!important}h1{font-size:clamp(42px,10vw,90px);margin:0 0 12px;text-shadow:0 0 18px #ff00ff,0 0 30px #00ffff}
p{font-size:clamp(16px,4vw,23px);line-height:1.5}button{background:linear-gradient(100deg,#f000bd,#00bfff);border:0;border-radius:15px;padding:15px 34px;color:white;font-size:22px;font-weight:900;cursor:pointer}
#status{font-size:13px;color:#ddd;margin-top:14px;max-width:90vw;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">🟡 <span id="coins">0</span></div><div class="pill"><span id="speed">54</span> KM/H</div></div>
<div class="screen" id="loading"><h1>CITY RUSH</h1><p>Загрузка неонового города…</p><div id="status"></div></div>
<div class="screen hidden" id="start"><h1>CITY RUSH</h1><p>НЕОНОВЫЙ ТОКИО<br>← → или A / D — смена полосы<br>Пробел / ↑ — прыжок<br>На телефоне — свайпы</p><button id="startBtn">ИГРАТЬ</button><div id="modelStatus" style="margin-top:15px;font-size:13px"></div></div>
<div class="screen hidden" id="over"><h1>GAME OVER</h1><p>Счёт: <b id="finalScore">0</b><br>Монеты: <b id="finalCoins">0</b></p><button id="restartBtn">ЕЩЁ РАЗ</button></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);
let scene,camera,renderer,clock,player,mixer=null,baseY=0,state='loading';
let speed=15,distance=0,score=0,coins=0,lane=0,vy=0,jumping=false,nextZ=-60;
const laneWidth=3.5,segments=[],obstacles=[],tokens=[];
const roadMat=new THREE.MeshStandardMaterial({color:0x171729,metalness:.4,roughness:.6});
const pink=new THREE.MeshBasicMaterial({color:0xff00e5});
const cyan=new THREE.MeshBasicMaterial({color:0x00eeff});
const gold=new THREE.MeshStandardMaterial({color:0xffc500,emissive:0x8a4b00,metalness:.8,roughness:.2});
const hazard=new THREE.MeshStandardMaterial({color:0xff2255,emissive:0x770022});
const geoRoad=new THREE.PlaneGeometry(12,20);
const geoDash=new THREE.PlaneGeometry(.12,2.5);
const geoCoin=new THREE.TorusGeometry(.4,.13,8,16);
function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);parent.add(o);return o}
function segment(z){
 const g=new THREE.Group();g.position.z=z;scene.add(g);segments.push(g);
 const road=mesh(geoRoad,roadMat,0,0,0,g);road.rotation.x=-Math.PI/2;
 for(let x of [-laneWidth/2,laneWidth/2])for(let k=-8;k<=8;k+=5){let d=mesh(geoDash,pink,x,.025,k,g);d.rotation.x=-Math.PI/2}
 for(let side of [-1,1]){
  mesh(new THREE.BoxGeometry(.25,.3,20),cyan,side*6.15,.15,0,g);
  const w=4+Math.random()*4,h=9+Math.random()*23;
  mesh(new THREE.BoxGeometry(w,h,8),new THREE.MeshStandardMaterial({color:0x151527}),side*(8+w/2),h/2,0,g);
  for(let row=2;row<h-1;row+=2.6)for(let col=-2.5;col<=2.5;col+=2.5){
   let win=mesh(new THREE.BoxGeometry(.12,.7,1),Math.random()>.5?pink:cyan,side*(8+.12),row,col,g);
  }
 }
}
function spawn(z){
 const blocked=Math.floor(Math.random()*3)-1;
 const low=Math.random()>.5;
 const o=mesh(new THREE.BoxGeometry(2.4,low?.8:2.5,.7),hazard,blocked*laneWidth,low?.4:1.25,z);
 obstacles.push({o,low});
 for(let l=-1;l<=1;l++)if(l!==blocked){
  for(let offset of [-3,0,3]){
   const c=mesh(geoCoin,gold,l*laneWidth,1,z+offset);tokens.push(c);
  }
 }
}
function fallback(){
 const g=new THREE.Group();
 const body=mesh(new THREE.CapsuleGeometry(.42,1.05,5,10),new THREE.MeshStandardMaterial({color:0x00ccff,emissive:0x003366}),0,1.05,0,g);
 mesh(new THREE.SphereGeometry(.28,12,10),new THREE.MeshStandardMaterial({color:0xffd4aa}),0,2.05,0,g);
 return g;
}
async function loadPlayer(){
 try{
  const gltf=await new Promise((resolve,reject)=>new GLTFLoader().load('./player_game.glb',resolve,undefined,reject));
  player=gltf.scene;
  const box=new THREE.Box3().setFromObject(player),size=box.getSize(new THREE.Vector3());
  if(!Number.isFinite(size.y)||size.y<=0)throw Error('Некорректный размер GLB');
  player.scale.setScalar(2.2/size.y);
  player.updateMatrixWorld(true);
  const adjusted=new THREE.Box3().setFromObject(player);
  player.position.y=-adjusted.min.y;baseY=player.position.y;
  if(gltf.animations.length){
   mixer=new THREE.AnimationMixer(player);
   const clip=gltf.animations.find(a=>/run|walk/i.test(a.name))||gltf.animations[0];
   mixer.clipAction(clip).play();
  }
  $('modelStatus').textContent='3D-модель загружена ✓';
 }catch(e){
  console.warn('GLB не загружен, используем встроенного персонажа:',e);
  player=fallback();baseY=0;
  $('modelStatus').textContent='Используется встроенный персонаж. Для своей модели положи player_game.glb рядом с index.html';
 }
 player.rotation.y=Math.PI;
 scene.add(player);
}
function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x09091b);scene.fog=new THREE.Fog(0x09091b,22,85);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,130);camera.position.set(0,4,8);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0x99aaff,0x181020,2.3));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,12,8);scene.add(light);
 clock=new THREE.Clock();
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
 window.addEventListener('keydown',key);
 let sx=0,sy=0;
 window.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});
 window.addEventListener('touchend',e=>{if(state!=='playing')return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))lane=THREE.MathUtils.clamp(lane+Math.sign(dx),-1,1);else if(dy< -25||Math.abs(dx)<12&&Math.abs(dy)<12)jump()},{passive:true});
 $('startBtn').onclick=reset;$('restartBtn').onclick=reset;
 loadPlayer().then(()=>{for(let i=0;i<7;i++)segment(-i*20);$('loading').classList.add('hidden');$('start').classList.remove('hidden');state='start'}).catch(e=>{$('status').textContent=e.message});
 animate();
}
function jump(){if(state==='playing'&&!jumping){jumping=true;vy=12}}
function key(e){
 if(['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(state==='start'||state==='over'){if(['Space','Enter'].includes(e.code))reset();return}
 if(state!=='playing')return;
 if(['ArrowLeft','KeyA'].includes(e.code)&&!e.repeat)lane=Math.max(-1,lane-1);
 if(['ArrowRight','KeyD'].includes(e.code)&&!e.repeat)lane=Math.min(1,lane+1);
 if(['Space','ArrowUp','KeyW'].includes(e.code))jump();
}
function clear(arr,getObject){for(const item of arr)scene.remove(getObject(item));arr.length=0}
function reset(){
 clear(segments,x=>x);clear(obstacles,x=>x.o);clear(tokens,x=>x);
 speed=15;distance=0;score=0;coins=0;lane=0;vy=0;jumping=false;nextZ=-60;
 player.position.set(0,baseY,0);player.rotation.set(0,Math.PI,0);player.visible=true;
 camera.position.set(0,4,8);
 for(let i=0;i<7;i++)segment(-i*20);
 for(let z=-35;z>=-95;z-=20)spawn(z);
 nextZ=-115;
 $('start').classList.add('hidden');$('over').classList.add('hidden');$('hud').style.display='flex';state='playing';
 clock.getDelta();
}
function end(){
 state='over';player.visible=false;$('hud').style.display='none';
 $('finalScore').textContent=score;$('finalCoins').textContent=coins;$('over').classList.remove('hidden');
}
function update(dt){
 if(state!=='playing')return;
 speed=Math.min(40,speed+.5*dt);distance+=speed*dt;score=Math.floor(distance+coins*50);
 player.position.z-=speed*dt;
 player.position.x=THREE.MathUtils.damp(player.position.x,lane*laneWidth,13,dt);
 if(jumping){vy-=30*dt;player.position.y+=vy*dt;if(player.position.y<=baseY){player.position.y=baseY;vy=0;jumping=false}}
 if(mixer)mixer.update(dt);
 camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*.45,5,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,player.position.y+3.8,5,dt);
 camera.position.z=player.position.z+8;
 camera.lookAt(player.position.x*.5,player.position.y+1.1,player.position.z-9);
 while(nextZ>player.position.z-115){segment(nextZ);spawn(nextZ-7);nextZ-=20}
 for(let i=segments.length-1;i>=0;i--)if(segments[i].position.z>player.position.z+25){scene.remove(segments[i]);segments.splice(i,1)}
 // Надёжные коллизии по игровым координатам, не зависят от формы GLB.
 for(let i=obstacles.length-1;i>=0;i--){
  const {o,low}=obstacles[i];
  if(o.position.z>player.position.z+12){scene.remove(o);obstacles.splice(i,1);continue}
  if(Math.abs(o.position.z-player.position.z)<.65&&Math.abs(o.position.x-player.position.x)<1.25&&(!low||player.position.y-baseY<.85)){end();return}
 }
 for(let i=tokens.length-1;i>=0;i--){
  const c=tokens[i];c.rotation.y+=dt*4;
  if(c.position.z>player.position.z+12){scene.remove(c);tokens.splice(i,1);continue}
  if(Math.abs(c.position.z-player.position.z)<.85&&Math.abs(c.position.x-player.position.x)<1&&Math.abs((player.position.y-baseY))<1.4){coins++;scene.remove(c);tokens.splice(i,1)}
 }
 $('score').textContent=score;$('coins').textContent=coins;$('speed').textContent=Math.floor(speed*3.6);
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}
init();
</script></body></html>
